<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1832" />
    <meta
      name="description"
      content="Acesse sua conta Agravo para acompanhar sua operação."
    />
    <title>Entrar | Agravo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sansita+Swashed:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-label="Área de login">
        <div class="login-panel">
          <a class="brand" href="/" aria-label="Agravo, página inicial">
            <img src="assets/logo.png" alt="Agravo" />
          </a>

          <div class="form-content">
            <div class="heading">
              <p class="eyebrow">Bem-vindo de volta</p>
              <h1>Entre na sua conta</h1>
              <p class="intro">
                Comece sua experiência com o Agravo fazendo login ou
                cadastrando-se.
              </p>
            </div>

            <form id="login-form" novalidate>
              <div class="field">
                <label for="email">E-mail</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="seuemail@exemplo.com"
                  required
                />
                <span class="field-error" id="email-error"></span>
              </div>

              <div class="field">
                <div class="label-row">
                  <label for="password">Senha</label>
                  <a class="text-link" href="#recuperar" id="forgot-password">
                    Esqueci minha senha
                  </a>
                </div>
                <div class="password-wrap">
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                    minlength="6"
                    required
                  />
                  <button
                    class="password-toggle"
                    type="button"
                    aria-label="Mostrar senha"
                    aria-pressed="false"
                    data-target="password"
                  >
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="M2.5 12s3.2-5 9.5-5 9.5 5 9.5 5-3.2 5-9.5 5-9.5-5-9.5-5Z" />
                      <circle cx="12" cy="12" r="2.5" />
                    </svg>
                  </button>
                </div>
                <span class="field-error" id="password-error"></span>
              </div>

              <label class="checkbox-label">
                <input id="remember" name="remember" type="checkbox" />
                <span class="checkmark" aria-hidden="true"></span>
                <span>Lembrar de mim</span>
              </label>

              <button class="submit-button" type="submit">
                <span>Entrar</span>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M5 12h13M13 6l6 6-6 6" />
                </svg>
              </button>
              <p class="form-status" id="form-status" role="status"></p>
            </form>

            <p class="signup">
              Ainda não possui uma conta?
              <a class="text-link" href="#cadastrar" id="signup-link">Cadastre-se</a>
            </p>
          </div>
        </div>

        <aside class="visual-panel" aria-label="Ilustração Agravo">
          <div class="visual-copy">
            <span class="badge">Gestão simples, resultado real</span>
            <h2>Seu negócio em boas mãos.</h2>
            <p>Organize sua rotina financeira e tome decisões com mais clareza.</p>
          </div>
          <img
            class="illustration"
            src="assets/login-illustration.png"
            alt="Profissional trabalhando em um laptop"
          />
          <div class="decor decor-one"></div>
          <div class="decor decor-two"></div>
        </aside>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
